name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: cog01kb0514cddd9qamvpce5ve7mr
  REGION: us-central1
  SERVICE_NAME: contract-mining-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_ADC_TOKEN }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Submit to Cloud Build
      run: |
        gcloud builds submit --config cloudbuild.yaml \
          --substitutions=_SERVICE_NAME=${{ env.SERVICE_NAME }},_REGION=${{ env.REGION }},_GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
